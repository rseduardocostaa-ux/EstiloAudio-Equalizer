name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Preparar o Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar a chave de assinatura
        run: base64 -d app/debug.keystore.b64 > app/debug.keystore

      - name: Compilar o APK (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: EstiloAudioEqualizer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
