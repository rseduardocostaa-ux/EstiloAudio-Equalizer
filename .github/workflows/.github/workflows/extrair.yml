name: Extrair projeto

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o zip
        run: |
          set -e
          ZIP=$(ls *.zip | head -n 1)
          mkdir /tmp/x
          unzip -q "$ZIP" -d /tmp/x
          SRC=$(dirname "$(find /tmp/x -name settings.gradle.kts | head -n 1)")
          rm -rf "$SRC/.github"
          cp -r "$SRC"/. .
          rm -f "$ZIP"

      - name: Enviar os arquivos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Adiciona o projeto" || exit 0
          git push
